services:
  - type: web
    name: sri-balaji-api
    runtime: python
    buildCommand: pip install -r requirements.txt bcrypt pydantic-settings
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sri-balaji-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  - name: sri-balaji-db
    databaseName: sribalaji
    user: sribalaji

