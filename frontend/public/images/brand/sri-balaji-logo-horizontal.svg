<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="100%" height="100%">
  <defs>
    <!-- Radiant Saffron Gold Gradient -->
    <linearGradient id="sbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="30%" stop-color="#F4C45E" />
      <stop offset="70%" stop-color="#D6A52D" />
      <stop offset="100%" stop-color="#936706" />
    </linearGradient>

    <!-- Warm Cream Plaque Gradient -->
    <linearGradient id="sbPlaqueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="50%" stop-color="#FFF9ED" />
      <stop offset="100%" stop-color="#FFF1D6" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="sbPlaqueShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#09030E" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#sbPlaqueShadow)">
    <!-- 1. Plaque Container with Double Golden Border -->
    <rect x="6" y="4" width="308" height="74" rx="14" fill="url(#sbPlaqueGrad)" stroke="#D6A52D" stroke-width="1.8" />
    <rect x="9.5" y="7.5" width="301" height="67" rx="11" fill="none" stroke="#F4C45E" stroke-width="0.8" opacity="0.65" />

    <!-- Corner Decorative Accents -->
    <text x="14" y="18" font-size="8" fill="#D6A52D" opacity="0.8">✦</text>
    <text x="300" y="18" font-size="8" fill="#D6A52D" opacity="0.8" text-anchor="end">✦</text>

    <!-- 2. Layer 1: "Sri" (Cursive / Script in Dark Forest Green) -->
    <g transform="translate(160, 22)">
      <!-- Left Golden Star -->
      <text x="-26" y="-1" text-anchor="middle" font-size="9" fill="#D6A52D">✦</text>
      <!-- "Sri" -->
      <text x="0" y="0"
            text-anchor="middle"
            font-family="'Great Vibes', 'Brush Script MT', cursive"
            font-size="22"
            fill="#0B3B24"
            font-weight="normal">
        Sri
      </text>
      <!-- Right Golden Star -->
      <text x="26" y="-1" text-anchor="middle" font-size="9" fill="#D6A52D">✦</text>
    </g>

    <!-- 3. Layer 2: "BALAJI" (Largest, Bold Artistic Typography in Deep Dark Green) -->
    <text x="160" y="44"
          text-anchor="middle"
          font-family="'Rozha One', 'Cinzel', 'Playfair Display', Georgia, serif"
          font-weight="900"
          font-size="22"
          letter-spacing="2.8"
          fill="#072B18">
      BALAJI
    </text>

    <!-- 4. Layer 3: "SPECIAL MIXTURE" (Smaller Uppercase in Dark Green with Spacing) -->
    <text x="160" y="56.5"
          text-anchor="middle"
          font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif"
          font-weight="900"
          font-size="8.8"
          letter-spacing="2.6"
          fill="#0B3B24">
      SPECIAL MIXTURE
    </text>

    <!-- Divider Line -->
    <line x1="36" y1="62.5" x2="284" y2="62.5" stroke="#D6A52D" stroke-width="0.75" stroke-opacity="0.6" />

    <!-- 5. Tagline: "FRESH - CRISPY - TASTY" (Uppercase, Dark Forest Green, Golden Separators) -->
    <g transform="translate(160, 71.5)">
      <text x="0" y="0"
            text-anchor="middle"
            font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif"
            font-weight="800"
            font-size="7.6"
            letter-spacing="1.8"
            fill="#0B3B24">
        FRESH <tspan fill="#D6A52D" font-weight="900">•</tspan> CRISPY <tspan fill="#D6A52D" font-weight="900">•</tspan> TASTY
      </text>
    </g>
  </g>
</svg>
