<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="hGoldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FCE182" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#E5BE4A" />
    </linearGradient>

    <!-- Deep Emerald Green Shield Gradient -->
    <radialGradient id="hEmeraldBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#155D3F" />
      <stop offset="60%" stop-color="#0E422C" />
      <stop offset="100%" stop-color="#051C13" />
    </radialGradient>

    <!-- Scarlet Red Ribbon Gradient -->
    <linearGradient id="hScarletRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881313" />
      <stop offset="30%" stop-color="#C5221F" />
      <stop offset="70%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#881313" />
    </linearGradient>

    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#030D08" flood-opacity="0.3" />
    </filter>

    <filter id="hGoldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#FCE182" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#hShadow)">
    <!-- ============================================== -->
    <!-- LEFT CREST EMBLEM (COMPACT EMERALD SHIELD)     -->
    <!-- ============================================== -->
    <g transform="translate(56, 60)">
      
      <!-- Laurel Leaves Embracing the Shield -->
      <g fill="url(#hGoldSheen)" stroke="#8C6615" stroke-width="0.5">
        <!-- Left Laurel Leaves -->
        <path d="M -38 -20 C -48 -28 -44 -40 -34 -38 C -36 -28 -32 -22 -38 -20 Z" />
        <path d="M -44 -2 C -54 -10 -52 -22 -42 -20 C -43 -12 -38 -4 -44 -2 Z" />
        <path d="M -44 18 C -54 10 -52 -2 -42 0 C -43 8 -38 16 -44 18 Z" />
        <path d="M -38 36 C -48 28 -44 16 -34 18 C -36 26 -32 34 -38 36 Z" />
        <path d="M -24 48 C -32 44 -28 32 -18 36 C -20 42 -18 46 -24 48 Z" />

        <!-- Right Laurel Leaves -->
        <path d="M 38 -20 C 48 -28 44 -40 34 -38 C 36 -28 32 -22 38 -20 Z" />
        <path d="M 44 -2 C 54 -10 52 -22 42 -20 C 43 -12 38 -4 44 -2 Z" />
        <path d="M 44 18 C 54 10 52 -2 42 0 C 43 8 38 16 44 18 Z" />
        <path d="M 38 36 C 48 28 44 16 34 18 C 36 26 32 34 38 36 Z" />
        <path d="M 24 48 C 32 44 28 32 18 36 C 20 42 18 46 24 48 Z" />
      </g>

      <!-- Emerald Shield Body -->
      <path d="M 0 -48 
               C 34 -48, 44 -32, 45 -2 
               C 46 26, 26 44, 0 54 
               C -26 44, -46 26, -45 -2 
               C -44 -32, -34 -48, 0 -48 Z" 
            fill="url(#hEmeraldBg)" 
            stroke="url(#hGoldSheen)" 
            stroke-width="3.5" />

      <!-- Inner Gold Ring -->
      <path d="M 0 -42 
               C 28 -42, 38 -28, 38 -2 
               C 40 22, 22 38, 0 46 
               C -22 38, -40 22, -38 -2 
               C -38 -28, -28 -42, 0 -42 Z" 
            fill="none" 
            stroke="url(#hGoldSheen)" 
            stroke-width="1.2" 
            stroke-dasharray="3,2" />

      <!-- Auspicious Kalash / Diya Flame at Crown -->
      <path d="M 0 -44 C -6 -35, -5 -27, 0 -22 C 5 -27, 6 -35, 0 -44 Z" fill="url(#hGoldSheen)" />

      <!-- Golden Monogram "SB" -->
      <text x="0" y="9" 
            text-anchor="middle" 
            font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
            font-weight="900" 
            font-size="28" 
            letter-spacing="1.5" 
            fill="url(#hGoldSheen)"
            filter="url(#hGoldGlow)">
        SB
      </text>

      <!-- 30+ Ribbon pill -->
      <rect x="-24" y="22" width="48" height="15" rx="7.5" fill="url(#hScarletRibbon)" stroke="url(#hGoldSheen)" stroke-width="1" />
      <text x="0" y="32.5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="8.5" fill="#FFFDF0" letter-spacing="1">
        30+ YRS
      </text>
    </g>


    <!-- ============================================== -->
    <!-- RIGHT TYPOGRAPHY & BRAND WORDMARK              -->
    <!-- ============================================== -->
    
    <!-- Top Sub-tag: ~ Sri ~ in Serif Italic -->
    <text x="125" y="30" 
          font-family="'Playfair Display', Georgia, serif" 
          font-weight="700" 
          font-style="italic" 
          font-size="18" 
          letter-spacing="3" 
          fill="#D4AF37">
      ~ Sri ~
    </text>

    <!-- Master Brand Name: BALAJI in Regal Serif -->
    <text x="125" y="68" 
          font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
          font-weight="900" 
          font-size="40" 
          letter-spacing="5" 
          fill="#2A0B1A">
      BALAJI
    </text>

    <!-- Scarlet Red Ribbon Pill: SPECIAL MIXTURES -->
    <g transform="translate(125, 78)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="url(#hScarletRibbon)" stroke="url(#hGoldSheen)" stroke-width="1.2" />
      <text x="110" y="16" 
            text-anchor="middle" 
            font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" 
            font-weight="900" 
            font-size="12" 
            letter-spacing="3" 
            fill="#FFFDF0">
        SPECIAL MIXTURES
      </text>
    </g>

    <!-- Heritage Tag: Fresh • Crispy • Tasty • Estd 1995 -->
    <text x="358" y="94" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="800" 
          font-size="10.5" 
          letter-spacing="1.5" 
          fill="#0E422C">
      FRESH • CRISPY • TASTY
    </text>
    <text x="358" y="76" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="10" 
          letter-spacing="1" 
          fill="#6E5034">
      Paralakhemundi, Odisha
    </text>

    <!-- Pure Veg Badge (Compact) -->
    <g transform="translate(500, 20)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#FFF" stroke="#16A34A" stroke-width="1.8" />
      <circle cx="9" cy="9" r="4" fill="#16A34A" />
    </g>

  </g>
</svg>
