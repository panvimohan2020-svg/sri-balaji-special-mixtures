<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radiant Saffron Gold Gradient -->
    <linearGradient id="sbGoldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#F4C45E" />
      <stop offset="70%" stop-color="#D6A52D" />
      <stop offset="100%" stop-color="#936706" />
    </linearGradient>

    <!-- Warm Cream Cartouche Gradient -->
    <linearGradient id="sbCrestCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FFF8EB" />
      <stop offset="100%" stop-color="#FFF0D4" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="sbCrestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#09030E" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#sbCrestShadow)" transform="translate(250, 240)">
    <!-- Top Crown / Kalash Finial -->
    <g transform="translate(0, -170)">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#D6A52D" stroke-width="2" />
      <circle cx="-25" cy="0" r="4" fill="#D6A52D" />
      <circle cx="25" cy="0" r="4" fill="#D6A52D" />
      <polygon points="0,-16 6,-4 18,-4 8,4 12,16 0,8 -12,16 -8,4 -18,-4 -6,-4" fill="url(#sbGoldSheen)" />
    </g>

    <!-- 1. Main Baroque Arched Cartouche Badge -->
    <rect x="-190" y="-150" width="380" height="300" rx="36" fill="url(#sbCrestCream)" stroke="#D6A52D" stroke-width="4.5" />
    <rect x="-180" y="-140" width="360" height="280" rx="28" fill="none" stroke="#F4C45E" stroke-width="1.8" opacity="0.65" />

    <!-- Corner Accents -->
    <text x="-165" y="-120" font-size="14" fill="#D9531E">❖</text>
    <text x="165" y="-120" font-size="14" fill="#D9531E" text-anchor="end">❖</text>
    <text x="-165" y="130" font-size="14" fill="#D9531E">❖</text>
    <text x="165" y="130" font-size="14" fill="#D9531E" text-anchor="end">❖</text>

    <!-- 2. Layer 1: "Sri" (Cursive / Script in Dark Forest Green) -->
    <g transform="translate(0, -65)">
      <text x="-50" y="-3" text-anchor="middle" font-size="16" fill="#D6A52D">✦</text>
      <text x="0" y="0"
            text-anchor="middle"
            font-family="'Great Vibes', 'Brush Script MT', cursive"
            font-size="54"
            fill="#0B3B24"
            font-weight="normal">
        Sri
      </text>
      <text x="50" y="-3" text-anchor="middle" font-size="16" fill="#D6A52D">✦</text>
    </g>

    <!-- 3. Layer 2: "BALAJI" (Largest, Bold Artistic Typography in Deep Dark Green) -->
    <text x="0" y="5"
          text-anchor="middle"
          font-family="'Rozha One', 'Cinzel', 'Playfair Display', Georgia, serif"
          font-weight="900"
          font-size="54"
          letter-spacing="5"
          fill="#072B18">
      BALAJI
    </text>

    <!-- 4. Layer 3: "SPECIAL MIXTURE" (Smaller Uppercase in Dark Green with Spacing) -->
    <text x="0" y="42"
          text-anchor="middle"
          font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif"
          font-weight="900"
          font-size="17"
          letter-spacing="5.5"
          fill="#0B3B24">
      SPECIAL MIXTURE
    </text>

    <!-- Divider Bar -->
    <line x1="-120" y1="62" x2="120" y2="62" stroke="#D6A52D" stroke-width="1.8" stroke-opacity="0.75" />

    <!-- 5. Tagline: "FRESH - CRISPY - TASTY" Ribbon -->
    <g transform="translate(0, 95)">
      <rect x="-145" y="-18" width="290" height="34" rx="17" fill="#FFFDF8" stroke="#D6A52D" stroke-width="1.8" />
      <text x="0" y="5"
            text-anchor="middle"
            font-family="'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif"
            font-weight="800"
            font-size="13"
            letter-spacing="2.8"
            fill="#0B3B24">
        FRESH <tspan fill="#D6A52D" font-weight="900">•</tspan> CRISPY <tspan fill="#D6A52D" font-weight="900">•</tspan> TASTY
      </text>
    </g>
  </g>
</svg>
