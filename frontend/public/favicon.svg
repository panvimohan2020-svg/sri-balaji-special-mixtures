<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FCE182" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#E5BE4A" />
    </linearGradient>

    <!-- Deep Emerald Green Shield Gradient -->
    <radialGradient id="favEmerald" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#155D3F" />
      <stop offset="60%" stop-color="#0E422C" />
      <stop offset="100%" stop-color="#051C13" />
    </radialGradient>

    <!-- Scarlet Red Gradient -->
    <linearGradient id="favScarlet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881313" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#881313" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="248" fill="#04160E" stroke="url(#favGold)" stroke-width="8" />

  <!-- Outer Laurel Wreath Ring -->
  <g fill="url(#favGold)">
    <path d="M 90 280 C 70 250, 75 200, 95 160 C 95 190, 105 230, 115 260 Z" />
    <path d="M 115 160 C 105 130, 125 90, 155 70 C 145 100, 145 135, 140 160 Z" />
    <path d="M 165 80 C 180 50, 220 35, 256 35 C 235 55, 215 75, 195 90 Z" />

    <path d="M 422 280 C 442 250, 437 200, 417 160 C 417 190, 407 230, 397 260 Z" />
    <path d="M 397 160 C 407 130, 387 90, 357 70 C 367 100, 367 135, 372 160 Z" />
    <path d="M 347 80 C 332 50, 292 35, 256 35 C 277 55, 297 75, 317 90 Z" />
  </g>

  <!-- Central Emerald Crest Shield -->
  <path d="M 256 70
           C 360 70, 410 115, 415 210
           C 420 320, 345 405, 256 460
           C 167 405, 92 320, 97 210
           C 102 115, 152 70, 256 70 Z"
        fill="url(#favEmerald)"
        stroke="url(#favGold)"
        stroke-width="10" />

  <!-- Inner Gold Inset -->
  <path d="M 256 90
           C 342 90, 385 125, 390 205
           C 395 295, 332 375, 256 426
           C 180 375, 117 295, 122 205
           C 126 125, 170 90, 256 90 Z"
        fill="none"
        stroke="url(#favGold)"
        stroke-width="2.5"
        stroke-dasharray="6,4" />

  <!-- Top Diya Flame / Kalash -->
  <path d="M 256 100 C 238 125, 240 145, 256 160 C 272 145, 274 125, 256 100 Z" fill="url(#favGold)" />

  <!-- Monogram "SB" -->
  <text x="256" y="270"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', Georgia, serif"
        font-weight="900"
        font-size="125"
        letter-spacing="4"
        fill="url(#favGold)">
    SB
  </text>

  <!-- Scarlet Ribbon: "SRI BALAJI" -->
  <rect x="126" y="305" width="260" height="46" rx="23" fill="url(#favScarlet)" stroke="url(#favGold)" stroke-width="3" />
  <text x="256" y="336"
        text-anchor="middle"
        font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif"
        font-weight="900"
        font-size="20"
        letter-spacing="3"
        fill="#FFFDF0">
    SRI BALAJI
  </text>

  <!-- 30+ YRS OF TRADITION -->
  <text x="256" y="390"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="800"
        font-size="14"
        letter-spacing="2"
        fill="url(#favGold)">
    • 30+ YEARS •
  </text>
</svg>
